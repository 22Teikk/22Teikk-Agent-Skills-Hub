description = "Implement tasks incrementally — build, test, verify, commit. Add \"auto\" to run the whole plan in one approved pass, or \"ultra\" to also run independent tasks in parallel worktrees."

prompt = """
**Open Questions gate (hard gate):** Run `bash scripts/check-open-questions.sh` from the repo root before invoking any skill. Non-zero exit = STOP and resolve/defer each `- [ ]` in `.teikk/spec/SPEC.md` `## Open Questions` (mark `- [x]` to resolve, `- [~]` to defer). Fall back to the prose check in `spec-driven-development` / `planning-and-task-breakdown` if the script is missing (older installs).

Read and follow `skills/incremental-implementation/SKILL.md` alongside `skills/test-driven-development/SKILL.md` and `skills/observability-and-instrumentation/SKILL.md`.

For platform-specific work: read `platform:` from `.teikk/spec/PROJECT.yaml`, then load the matching platform skill/persona based on task type — Android (`skills/android-ui-kotlin` / `android-data-and-concurrency-kotlin` / `android-di-and-build` + `agents/kotlin-specialist`); iOS (`agents/swift-expert`); Flutter (`agents/flutter-expert`). Phase 0 Foundation (Hilt+observability / SPM+SwiftLint / flavor+logging) must complete before feature slices. Instrument logging inline as part of GREEN per `observability-and-instrumentation` — do not defer to `/teikk-observability`.

## Modes (user argument selects)

- **`/teikk-build`** — next pending task only, then stop. RED→GREEN→regression→build→commit per `incremental-implementation`.
- **`/teikk-build auto`** — single plan approval, then loop every task in dependency order. Requires `.teikk/spec/SPEC.md` + clean `git status`.
- **`/teikk-build ultra`** — like `auto`, but `### Wave N (parallel-safe)` groups run concurrently in worktrees (algorithm in `docs/commands/appendices/build-wave-execution.md`). No waves = behaves as `auto`.

## Task lookup (O(1) resume)

Read `.teikk/tasks/todo.md` first — its `**Current task:**` line is the source of truth. Resume `[~]` (jump to that task's `## Task N:` in `plan.md`); else pick the next `[ ]` in file order. If `todo.md` doesn't exist, scan `plan.md`, then create `todo.md` per `planning-and-task-breakdown` Step 6.

## Telemetry (opt-in)

If `TEIKK_TELEMETRY=on`, source `hooks/emit.sh` and emit `verification_passed ok` / `verification_failed failed` per task. Fails open. See `references/observability-and-benchmark.md`.
"""
