name: Release on main (major bump)

# Every push to main (i.e. every PR merge) publishes a new MAJOR version
# tag + GitHub Release — e.g. package.json 5.0.0 -> 6.0.0. The version base
# is package.json (never bumped by humans); the workflow commits the bump
# and tags it vX.Y.Z.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      bump: major
    secrets: inherit
