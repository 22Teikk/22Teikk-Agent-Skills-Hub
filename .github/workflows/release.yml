name: Release (reusable)

# Shared release logic for the main/uat trigger workflows.
#
# package.json is the version source of truth (currently 5.0.0) — humans never
# bump it manually. On merge:
#   - uat  (release-uat.yml)  → minor bump: 5.0.0 → 5.1.0
#   - main (release-main.yml) → major bump: 5.0.0 → 6.0.0
# The workflow reads the current version from package.json, applies the bump,
# commits + pushes the new package.json, then creates tag vX.Y.Z on the bump
# commit and publishes a GitHub Release. Old v10.x-era tags from the previous
# tag-based scheme are ignored as a base — package.json always wins.

on:
  workflow_call:
    inputs:
      bump:
        description: "Version bump type: major or minor"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run test suite
        run: TEIKK_AGENTS_SKILLS_SKIP_POSTINSTALL=1 npm test

  release:
    name: Compute next version and publish release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version from package.json
        id: version
        run: |
          set -euo pipefail

          # Skip if this exact commit is already tagged — prevents a
          # duplicate release if the workflow re-runs on the same commit.
          if git describe --tags --exact-match HEAD 2>/dev/null; then
            echo "HEAD is already tagged — skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Skip-release guard -------------------------------------------------
          # (a) explicit opt-out via commit message
          commit_msg="$(git log -1 --pretty=%B HEAD)"
          if echo "$commit_msg" | grep -iqE '\[skip[ -]release\]'; then
            echo "HEAD commit requests [skip release] — publishing without a version bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # (b) docs-only diff → no version bump.
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          zero="0000000000000000000000000000000000000000"
          range_ok=false
          changed=""
          if [ -n "$before" ] && [ "$before" != "$zero" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            if changed="$(git diff --name-only "$before" "$after" 2>/dev/null)"; then
              range_ok=true
            fi
          fi

          if [ "$range_ok" = true ]; then
            if [ -z "$changed" ]; then
              echo "No file changes detected in range; proceeding with release."
            elif echo "$changed" | grep -qvE '(\.md$|^docs/)'; then
              echo "Non-docs changes present; proceeding with release."
            else
              echo "Docs-only change detected — publishing without a version bump."
              echo "Changed files:"; echo "$changed" | sed 's/^/  /'
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "Push range indeterminate — cannot classify as docs-only; proceeding with release (fail-safe)."
          fi
          # --- end guard ----------------------------------------------------------

          # --- Read current version from package.json (source of truth) ---
          # Humans never bump this; the workflow writes the bumped value back
          # and tags it. Tags from the old tag-based scheme (v10.x) are NOT used
          # as a base — package.json always wins.
          current="$(node -p "require('./package.json').version")"
          echo "Current package.json version: $current"

          IFS='.' read -r major minor patch <<< "$current"

          case "${{ inputs.bump }}" in
            major)
              next="$((major + 1)).0.0"
              ;;
            minor)
              next="${major}.$((minor + 1)).0"
              ;;
            *)
              echo "Unknown bump type: '${{ inputs.bump }}' (expected major or minor)" >&2
              exit 1
              ;;
          esac

          new_tag="v${next}"

          if git rev-parse "$new_tag" >/dev/null 2>&1; then
            echo "Computed tag $new_tag already exists — refusing to overwrite. Check tag history." >&2
            exit 1
          fi

          echo "New version: $next"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Bump package.json, commit and push
        id: bump
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

          echo "bump_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.tag }}" "${{ steps.bump.outputs.bump_sha }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ steps.bump.outputs.bump_sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Warn on plugin.json version drift
        if: steps.version.outputs.skip != 'true'
        run: |
          # Non-blocking check: .claude-plugin/plugin.json's "version" field is
          # hand-maintained (this workflow never bumps it — the git tag remains
          # the install source of truth). If it falls behind the new tag, warn
          # so a human remembers to sync it in a follow-up PR — do not fail the
          # release over it.
          plugin_version="$(node -p "require('./.claude-plugin/plugin.json').version" 2>/dev/null || echo "unknown")"
          new_version="${{ steps.version.outputs.version }}"
          if [ "$plugin_version" != "$new_version" ]; then
            echo "::warning file=.claude-plugin/plugin.json::plugin.json version ($plugin_version) does not match the new release tag (v$new_version). Consider syncing it in a follow-up commit — Claude Code plugin installs read this field directly."
          fi
